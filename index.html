<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>João Gualberto — Developer / Designer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Instrument+Serif:ital@1&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#FFFFFF;--ink:#111111;--muted:#555555;--logo-filter:none;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111111;--ink:#F5F5F5;--muted:#A8A8A8;--logo-filter:invert(1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111111;--ink:#F5F5F5;--muted:#A8A8A8;--logo-filter:invert(1);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 "DM Sans",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 1.25rem}
:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
button,summary{font:inherit;color:inherit}
.serif{font-family:"Abril Fatface",Georgia,serif;font-weight:400}
.ital{font-family:"Instrument Serif",Georgia,serif;font-style:italic}

.tbar{display:flex;justify-content:flex-end;padding:1.25rem 0 0}
.tbtn{background:var(--bg);border:2px solid var(--ink);border-radius:999px;padding:.35rem 1rem;font-weight:600;font-size:.9rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.tbtn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hero{padding:2rem 0 2rem;display:grid;gap:2rem}
.logo{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;width:min(560px,100%)}
.logo img{display:block;width:100%;height:auto;filter:var(--logo-filter)}
.bubble{position:absolute;top:-.5rem;right:.5rem;background:var(--ink);color:var(--bg);border-radius:20px 20px 20px 4px;padding:.3rem .9rem;font-family:"Abril Fatface",serif;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.intro{font-size:clamp(1.5rem,4.2vw,2.4rem);line-height:1.2;max-width:26ch;margin:0}
.intro{margin:0;min-height:3.6em}
#rot{transition:opacity .35s}
#rot.out{opacity:0}

h2.sec{font-size:clamp(2rem,5vw,3rem);margin:3rem 0 1.5rem;line-height:1}
.grid{display:grid;gap:2rem;padding-bottom:3rem}
@media (min-width:880px){.grid{grid-template-columns:1fr 1fr;align-items:start}}
.card{border:2.5px solid var(--ink);border-radius:32px;padding:clamp(1.4rem,4vw,2.2rem);box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column;gap:1rem;transition:transform .15s,box-shadow .15s;background:var(--bg)}
.card:hover{transform:translate(4px,4px);box-shadow:4px 4px 0 var(--ink)}
.plat{font-size:1.3rem;margin:0}
.card h3{font-size:clamp(2rem,4.5vw,2.8rem);line-height:1;margin:0}
.card p.d{margin:0;max-width:44ch}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:0;padding:0;list-style:none}
.chips li{border:2px solid var(--ink);border-radius:999px;padding:.15rem .85rem;font-weight:600;font-size:.9rem}
details{border-top:2px solid var(--ink);padding-top:.9rem}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 1.6rem/1 "Abril Fatface",serif;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details ul{margin:.9rem 0 0;padding-left:1.1rem;display:grid;gap:.3rem}
.cta{align-self:flex-start;text-decoration:none;background:var(--ink);color:var(--bg);font-weight:600;padding:.7rem 1.5rem;border-radius:999px;border:2px solid var(--ink)}
.cta:hover{background:var(--bg);color:var(--ink)}

button.cta{font:inherit;font-weight:600;cursor:pointer}
dialog#gal{border:2.5px solid var(--ink);border-radius:28px;background:var(--bg);color:var(--ink);padding:1rem;width:min(1000px,calc(100% - 1.5rem));max-height:calc(100% - 1.5rem);overflow:auto;box-shadow:8px 8px 0 var(--ink)}
dialog#gal::backdrop{background:rgba(0,0,0,.65)}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.75rem}
.gtop h3{margin:0;font-size:clamp(1.3rem,3.5vw,1.9rem);line-height:1}
#gal figure{margin:0}
#gimg{display:block;width:100%;height:auto;border:2px solid var(--ink);border-radius:14px}
#gcap{margin:.8rem 0 0;font-size:.95rem;color:var(--muted)}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.9rem}
.gbtn{background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:.4rem 1.1rem;font:inherit;font-weight:600;cursor:pointer}
.gbtn:hover{background:var(--ink);color:var(--bg)}
.tbar{gap:.6rem;align-items:center}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.seg button{background:var(--bg);color:var(--ink);border:0;padding:.35rem .8rem;font-weight:600;font-size:.9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.acts{display:flex;flex-wrap:wrap;gap:.6rem}
.cta.alt{background:var(--bg);color:var(--ink)}
.cta.alt:hover{background:var(--ink);color:var(--bg)}
footer{border-top:2.5px solid var(--ink);padding:2.5rem 0 4rem}
footer h2{font-size:clamp(2rem,6vw,3.4rem);margin:0 0 1rem;line-height:1}
footer a{color:var(--ink);font-weight:600;margin-right:1.5rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="tbar"><div class="seg" id="seg" role="group" aria-label="Idioma / Language"><button type="button" data-l="pt" aria-pressed="true">PT</button><button type="button" data-l="en" aria-pressed="false">EN</button></div><button class="tbtn" id="theme" type="button"></button></div>
  <section class="hero">
    <button class="logo" id="logo" type="button" aria-label="João Gualberto, Developer / Designer. Clique no carneiro.">

const li=a=>a.map(x=>`<li>${x}</li>`).join("");
const card=(p,i)=>`<article class="card"><p class="plat ital">${L(p.plat)}</p><h3 class="serif">${p.nome}</h3><p class="d">${L(p.desc)}</p><ul class="chips">${li(p.tech)}</ul>${p.modulos?`<details><summary>${UI[lang].inside}</summary><ul>${li(L(p.modulos))}</ul></details>`:""}<div class="acts">${p.telas?`<button class="cta" type="button" data-gal="${i}">${L(p.botao)||"Ver telas"}</button>`:""}${(p.links||[]).map(l=>`<a class="cta alt" href="${l.url}" target="_blank" rel="noopener">${L(l.texto)}</a>`).join("")}</div></article>`;

let cur=[],curP=null,gi=0,si=0;const gal=$("#gal");

$("#gnext").onclick=()=>{gi=(gi+1)%cur.length;drawGal();};
$("#gprev").onclick=()=>{gi=(gi-1+cur.length)%cur.length;drawGal();};
$("#gclose").onclick=()=>gal.close();
gal.addEventListener("click",e=>{if(e.target===gal)gal.close();});
gal.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("#gnext").click();if(e.key==="ArrowLeft")$("#gprev").click();});

const root=document.documentElement;
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
const drawTheme=()=>{$("#theme").textContent=isDark()?UI[lang].light:UI[lang].dark;};
$("#theme").addEventListener("click",()=>{root.dataset.theme=isDark()?"light":"dark";drawTheme();});

function render(){
  const u=UI[lang];root.lang=lang==="pt"?"pt-BR":"en";document.title=u.title;
  $("#h-proj").textContent=u.proj;$("#h-talk").textContent=u.talk;$("#mail").textContent=u.mail;

setInterval(nextSlogan,4500);
render();
let t;
